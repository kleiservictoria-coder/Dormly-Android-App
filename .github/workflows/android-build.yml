name: Build Dormly Android Prototype

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Package project source ZIP
        run: zip -r Dormly_Android_Prototype.zip . -x ".git/*" ".gradle/*" "*/build/*"

      - name: Upload APK and project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Dormly-Android-Deliverables
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            Dormly_Android_Prototype.zip
          if-no-files-found: error
          retention-days: 14
